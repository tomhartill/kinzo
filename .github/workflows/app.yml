name: App

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: {}  # "Run workflow" button on the Actions tab
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

jobs:
  android:
    name: Android build and shared tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK, desktop app and run shared tests
        run: ./gradlew :androidApp:assembleDebug :desktopApp:assemble :shared:jvmTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kinzo-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for the iOS simulator
        working-directory: app/iosApp
        run: xcodebuild -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
