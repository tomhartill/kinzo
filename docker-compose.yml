# Local development: `docker compose up` starts Postgres and the API on http://localhost:8080.
# To run the API from source instead: `docker compose up db`, then see api/README.md.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kinzo
      POSTGRES_PASSWORD: kinzo
      POSTGRES_DB: kinzo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP probe: the temporary server during first-run init only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U kinzo -d kinzo"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    restart: on-failure
    environment:
      DATABASE_URL: postgres://kinzo:kinzo@db:5432/kinzo?sslmode=disable
      # Sign-in. Put these in a .env file next to this one; see docs/sign-in.md.
      KINZO_PUBLIC_URL: ${KINZO_PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
